<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="800" height="400" rx="16" fill="#0A192F"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="none" stroke="#1E3A5F" stroke-width="1"/>

  <!-- title -->
  <text x="40" y="42" fill="#3B82F6" font-size="20" font-weight="700">Contributions — Hafiz Ali Salman</text>
  <text x="40" y="60" fill="#64748B" font-size="12">Last 12 months</text>

  <!-- gridlines + y labels -->
  <g stroke="#1B2B45" stroke-width="1">
    <line x1="60" y1="340" x2="770" y2="340"/>
    <line x1="60" y1="295" x2="770" y2="295"/>
    <line x1="60" y1="250" x2="770" y2="250"/>
    <line x1="60" y1="205" x2="770" y2="205"/>
    <line x1="60" y1="160" x2="770" y2="160"/>
    <line x1="60" y1="115" x2="770" y2="115"/>
    <line x1="60" y1="70"  x2="770" y2="70"/>
  </g>
  <g fill="#64748B" font-size="11" text-anchor="end">
    <text x="50" y="344">0</text>
    <text x="50" y="299">5</text>
    <text x="50" y="254">10</text>
    <text x="50" y="209">15</text>
    <text x="50" y="164">20</text>
    <text x="50" y="119">25</text>
    <text x="50" y="74">30</text>
  </g>

  <!-- area fill -->
  <polygon fill="url(#area)"
    points="60,340 60,268 124,232 189,286 254,205 318,250 383,178 447,214 512,142 576,196 641,115 705,160 770,88 770,340"/>

  <!-- line -->
  <polyline fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    points="60,268 124,232 189,286 254,205 318,250 383,178 447,214 512,142 576,196 641,115 705,160 770,88"/>

  <!-- data points -->
  <g fill="#0A192F" stroke="#3B82F6" stroke-width="2.5">
    <circle cx="60"  cy="268" r="4"/>
    <circle cx="124" cy="232" r="4"/>
    <circle cx="189" cy="286" r="4"/>
    <circle cx="254" cy="205" r="4"/>
    <circle cx="318" cy="250" r="4"/>
    <circle cx="383" cy="178" r="4"/>
    <circle cx="447" cy="214" r="4"/>
    <circle cx="512" cy="142" r="4"/>
    <circle cx="576" cy="196" r="4"/>
    <circle cx="641" cy="115" r="4"/>
    <circle cx="705" cy="160" r="4"/>
    <circle cx="770" cy="88"  r="5" fill="#3B82F6"/>
  </g>

  <!-- x labels -->
  <g fill="#64748B" font-size="11" text-anchor="middle">
    <text x="60"  y="362">Jan</text>
    <text x="124" y="362">Feb</text>
    <text x="189" y="362">Mar</text>
    <text x="254" y="362">Apr</text>
    <text x="318" y="362">May</text>
    <text x="383" y="362">Jun</text>
    <text x="447" y="362">Jul</text>
    <text x="512" y="362">Aug</text>
    <text x="576" y="362">Sep</text>
    <text x="641" y="362">Oct</text>
    <text x="705" y="362">Nov</text>
    <text x="770" y="362">Dec</text>
  </g>
</svg>
