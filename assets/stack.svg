<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <linearGradient id="stBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1620"/>
      <stop offset="100%" stop-color="#0C1A24"/>
    </linearGradient>
    <linearGradient id="stRing1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C2CB"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="stRing2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="stRing3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      @keyframes orbitRot1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes orbitRot2 { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      .orbit-1 { transform-origin: 280px 250px; animation: orbitRot1 24s linear infinite; }
      .orbit-2 { transform-origin: 280px 250px; animation: orbitRot2 32s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="540" rx="20" fill="url(#stBg)" stroke="#1A3A44" stroke-width="1.5"/>

  <!-- Orbit Visual (Left Column) -->
  <g transform="translate(280, 250)">
    <!-- Core Hub -->
    <circle cx="0" cy="0" r="44" fill="#122430" stroke="#00C2CB" stroke-width="2.5"/>
    <text x="0" y="8" class="sans" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle">STACK</text>

    <!-- Tilted Elliptical Orbit 1 -->
    <ellipse cx="0" cy="0" rx="210" ry="85" fill="none" stroke="url(#stRing1)" stroke-width="1.5" stroke-dasharray="6 6" transform="rotate(-20)"/>
    <!-- Tilted Elliptical Orbit 2 -->
    <ellipse cx="0" cy="0" rx="230" ry="95" fill="none" stroke="url(#stRing2)" stroke-width="1.5" opacity="0.6" transform="rotate(35)"/>
    <!-- Tilted Elliptical Orbit 3 -->
    <ellipse cx="0" cy="0" rx="250" ry="110" fill="none" stroke="url(#stRing3)" stroke-width="1.2" opacity="0.4" transform="rotate(-65)"/>

    <!-- Orbiting Tech Nodes -->
    <g transform="rotate(-20)">
      <circle cx="210" cy="0" r="18" fill="#0F1F2A" stroke="#00C2CB" stroke-width="2"/>
      <text x="210" y="5" class="mono" font-size="9" font-weight="700" fill="#5EEAD4" text-anchor="middle">NODE</text>

      <circle cx="-210" cy="0" r="18" fill="#0F1F2A" stroke="#22c55e" stroke-width="2"/>
      <text x="-210" y="5" class="mono" font-size="8" font-weight="700" fill="#4ade80" text-anchor="middle">PGSQL</text>
    </g>

    <g transform="rotate(35)">
      <circle cx="230" cy="0" r="18" fill="#0F1F2A" stroke="#2DD4BF" stroke-width="2"/>
      <text x="230" y="5" class="mono" font-size="10" font-weight="700" fill="#2DD4BF" text-anchor="middle">REACT</text>

      <circle cx="-230" cy="0" r="18" fill="#0F1F2A" stroke="#0E7490" stroke-width="2"/>
      <text x="-230" y="5" class="mono" font-size="10" font-weight="700" fill="#99F6E4" text-anchor="middle">NEXT</text>
    </g>
  </g>

  <!-- Grouped Tech Chips (Right Column) -->
  <g transform="translate(620, 50)">
    <text x="0" y="25" class="mono" font-size="13" font-weight="700" fill="#00C2CB" letter-spacing="2">03 // ECOSYSTEM &amp; TOOLING</text>
    <text x="0" y="60" class="sans" font-size="26" font-weight="800" fill="#f8fafc">Technical Stack Breakdown</text>

    <!-- Backend Group -->
    <g transform="translate(0, 95)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="700" fill="#94a3b8">BACKEND &amp; APIS</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="90" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="45" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Node.js</text>

        <rect x="100" y="0" width="105" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="152" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Express.js</text>

        <rect x="215" y="0" width="95" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="262" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">REST APIs</text>

        <rect x="320" y="0" width="115" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="377" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Integrations</text>
      </g>
    </g>

    <!-- Frontend Group -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="700" fill="#94a3b8">FRONTEND &amp; UI</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="85" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="42" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">React.js</text>

        <rect x="95" y="0" width="90" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="140" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Next.js</text>

        <rect x="195" y="0" width="115" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="252" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Tailwind CSS</text>

        <rect x="320" y="0" width="110" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="375" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">TypeScript</text>
      </g>
    </g>

    <!-- Cloud & Data Group -->
    <g transform="translate(0, 295)">
      <text x="0" y="0" class="mono" font-size="12" font-weight="700" fill="#94a3b8">DATA, STATE &amp; TOOLING</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="105" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="52" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">PostgreSQL</text>

        <rect x="115" y="0" width="100" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="165" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">MongoDB</text>

        <rect x="225" y="0" width="130" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="290" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">React Query</text>

        <rect x="365" y="0" width="90" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="410" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Zustand</text>

        <rect x="465" y="0" width="75" height="34" rx="8" fill="#0F1F2A" stroke="#1F4A55"/>
        <text x="502" y="22" class="sans" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Docker</text>
      </g>
    </g>
  </g>
</svg>
