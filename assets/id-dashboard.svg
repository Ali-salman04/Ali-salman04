<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1620"/>
      <stop offset="100%" stop-color="#0C1A24"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#1F4A55"/>
    </linearGradient>
    <linearGradient id="badgeAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C2CB"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      @keyframes lanyardSwing {
        0%   { transform: rotate(-1.5deg); }
        50%  { transform: rotate(1.5deg); }
        100% { transform: rotate(-1.5deg); }
      }
      .hanging-badge {
        transform-origin: 220px 0px;
        animation: lanyardSwing 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="480" rx="20" fill="url(#dashBg)" stroke="#1A3A44" stroke-width="1.5"/>

  <!-- Left: Hanging ID Card with Metal Clasp -->
  <g class="hanging-badge">
    <!-- Lanyard Strap -->
    <rect x="208" y="0" width="24" height="60" fill="#1A3A44" stroke="#1F4A55"/>
    <!-- Metal Clasp -->
    <rect x="200" y="55" width="40" height="18" rx="4" fill="url(#metalGrad)"/>
    <circle cx="220" cy="64" r="4" fill="#122430"/>

    <!-- ID Badge Body -->
    <g transform="translate(80, 80)">
      <rect width="280" height="360" rx="16" fill="#0F1F2A" stroke="#1F4A55" stroke-width="2"/>
      <rect x="1" y="1" width="278" height="358" rx="15" fill="none" stroke="url(#badgeAccent)" stroke-opacity="0.3"/>

      <!-- Photo Frame — teal ring (matches profile avatar) -->
      <rect x="65" y="30" width="150" height="150" rx="14" fill="#00C2CB"/>
      <circle cx="140" cy="105" r="58" fill="#00C2CB"/>
      <circle cx="140" cy="105" r="52" fill="#122430"/>
      <text x="140" y="118" class="sans" font-size="32" font-weight="900" fill="#5EEAD4" text-anchor="middle">HAS</text>

      <text x="140" y="215" class="sans" font-size="18" font-weight="800" fill="#f8fafc" text-anchor="middle">HAFIZ ALI SALMAN</text>
      <text x="140" y="238" class="mono" font-size="12" font-weight="600" fill="#5EEAD4" text-anchor="middle">FULL STACK ENGINEER</text>

      <!-- Barcode Graphic -->
      <g transform="translate(45, 270)">
        <rect x="0" y="0" width="4" height="40" fill="#94a3b8"/>
        <rect x="8" y="0" width="8" height="40" fill="#94a3b8"/>
        <rect x="20" y="0" width="3" height="40" fill="#94a3b8"/>
        <rect x="28" y="0" width="6" height="40" fill="#94a3b8"/>
        <rect x="40" y="0" width="10" height="40" fill="#94a3b8"/>
        <rect x="55" y="0" width="4" height="40" fill="#94a3b8"/>
        <rect x="64" y="0" width="8" height="40" fill="#94a3b8"/>
        <rect x="78" y="0" width="4" height="40" fill="#94a3b8"/>
        <rect x="88" y="0" width="12" height="40" fill="#94a3b8"/>
        <rect x="105" y="0" width="5" height="40" fill="#94a3b8"/>
        <rect x="115" y="0" width="8" height="40" fill="#94a3b8"/>
        <rect x="130" y="0" width="6" height="40" fill="#94a3b8"/>
        <rect x="142" y="0" width="10" height="40" fill="#94a3b8"/>
        <rect x="158" y="0" width="4" height="40" fill="#94a3b8"/>
        <rect x="168" y="0" width="8" height="40" fill="#94a3b8"/>
        <rect x="180" y="0" width="10" height="40" fill="#94a3b8"/>
      </g>
      <text x="140" y="325" class="mono" font-size="10" fill="#64748b" text-anchor="middle">AUTH-ID // 2026-HAS-RCM</text>
    </g>
  </g>

  <!-- Right: Verified Metrics & Engineering Snapshot -->
  <g transform="translate(450, 60)">
    <text x="0" y="20" class="mono" font-size="13" font-weight="700" fill="#00C2CB" letter-spacing="2">04 // VERIFIED ENGINEERING METRICS</text>
    <text x="0" y="55" class="sans" font-size="26" font-weight="800" fill="#f8fafc">Technical Snapshot &amp; Status</text>

    <!-- Metric Cards -->
    <g transform="translate(0, 90)">
      <!-- Card 1 -->
      <rect width="320" height="110" rx="14" fill="#0F1F2A" stroke="#1A3A44"/>
      <text x="25" y="38" class="mono" font-size="12" fill="#94a3b8">PRIMARY DOMAIN</text>
      <text x="25" y="72" class="sans" font-size="20" font-weight="700" fill="#5EEAD4">Integrations &amp; APIs</text>
      <text x="25" y="94" class="mono" font-size="12" fill="#64748b">Node • REST • EHR / Clearinghouse</text>

      <!-- Card 2 -->
      <g transform="translate(345, 0)">
        <rect width="320" height="110" rx="14" fill="#0F1F2A" stroke="#1A3A44"/>
        <text x="25" y="38" class="mono" font-size="12" fill="#94a3b8">ORGANIZATION</text>
        <text x="25" y="72" class="sans" font-size="20" font-weight="700" fill="#34d399">Medsynthea</text>
        <text x="25" y="94" class="mono" font-size="12" fill="#64748b">Lahore, Pakistan · Healthcare RCM</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 130)">
        <rect width="320" height="110" rx="14" fill="#0F1F2A" stroke="#1A3A44"/>
        <text x="25" y="38" class="mono" font-size="12" fill="#94a3b8">WEB ARCHITECTURE</text>
        <text x="25" y="72" class="sans" font-size="20" font-weight="700" fill="#2DD4BF">Full Stack React/Next</text>
        <text x="25" y="94" class="mono" font-size="12" fill="#64748b">React Query • Zustand • Tailwind</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(345, 130)">
        <rect width="320" height="110" rx="14" fill="#0F1F2A" stroke="#1A3A44"/>
        <text x="25" y="38" class="mono" font-size="12" fill="#94a3b8">PLATFORM SCALE</text>
        <text x="25" y="72" class="sans" font-size="20" font-weight="700" fill="#5EEAD4">10k+ User Platforms</text>
        <text x="25" y="94" class="mono" font-size="12" fill="#64748b">SaaS • Marketplaces • PostgreSQL</text>
      </g>
    </g>
  </g>
</svg>
