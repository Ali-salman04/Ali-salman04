<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="cnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1620"/>
      <stop offset="100%" stop-color="#0C1A24"/>
    </linearGradient>
    <linearGradient id="cnAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C2CB"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      @keyframes nudgeRight {
        0%, 100% { transform: translateX(0); }
        50%      { transform: translateX(8px); }
      }
      .arrow-nudge { animation: nudgeRight 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#cnBg)" stroke="#1A3A44" stroke-width="1.5"/>

  <!-- Left Column: Character / Action Pitch -->
  <g transform="translate(60, 60)">
    <!-- Decorative Icon Box -->
    <rect width="64" height="64" rx="16" fill="#0F1F2A" stroke="#00C2CB" stroke-width="2"/>
    <text x="32" y="42" class="sans" font-size="28" font-weight="bold" fill="url(#cnAccent)" text-anchor="middle">⚡</text>

    <text x="0" y="115" class="mono" font-size="13" font-weight="700" fill="#0E7490" letter-spacing="2">05 // INITIATE CONTACT</text>
    <text x="0" y="155" class="sans" font-size="34" font-weight="900" fill="#f8fafc">Let's Build Something<tspan fill="#00C2CB">.</tspan></text>
    <text x="0" y="195" class="sans" font-size="16" fill="#94a3b8">
      Open for full stack engineering roles, SaaS products,
    </text>
    <text x="0" y="222" class="sans" font-size="16" fill="#94a3b8">
      third-party integrations, and high-impact collaborations.
    </text>

    <g transform="translate(0, 260)">
      <rect width="210" height="44" rx="10" fill="#0F1F2A" stroke="#1F4A55"/>
      <text x="20" y="27" class="mono" font-size="13" fill="#5EEAD4">📍 Lahore, Pakistan</text>
    </g>
  </g>

  <!-- Right Column: Generously Spaced Platform Cards -->
  <g transform="translate(620, 50)">
    <!-- LinkedIn Card -->
    <g transform="translate(0, 0)">
      <rect width="520" height="90" rx="14" fill="#0F1F2A" stroke="#1A3A44"/>
      <circle cx="50" cy="45" r="24" fill="#0a66c2"/>
      <text x="50" y="52" class="sans" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">in</text>
      
      <text x="95" y="38" class="sans" font-size="18" font-weight="700" fill="#f8fafc">LinkedIn Professional Network</text>
      <text x="95" y="62" class="mono" font-size="13" fill="#5EEAD4">linkedin.com/in/hafiz-ali-salman</text>
      
      <text x="475" y="52" class="sans arrow-nudge" font-size="24" fill="#00C2CB">→</text>
    </g>

    <!-- Email Card -->
    <g transform="translate(0, 110)">
      <rect width="520" height="90" rx="14" fill="#0F1F2A" stroke="#1A3A44"/>
      <circle cx="50" cy="45" r="24" fill="#122430" stroke="#00C2CB" stroke-width="2"/>
      <text x="50" y="52" class="sans" font-size="18" font-weight="900" fill="#00C2CB" text-anchor="middle">✉</text>
      
      <text x="95" y="38" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Direct Email</text>
      <text x="95" y="62" class="mono" font-size="13" fill="#5EEAD4">halisalman04@gmail.com</text>
      
      <text x="475" y="52" class="sans arrow-nudge" font-size="24" fill="#0E7490">→</text>
    </g>

    <!-- GitHub Card -->
    <g transform="translate(0, 220)">
      <rect width="520" height="90" rx="14" fill="#0F1F2A" stroke="#1A3A44"/>
      <circle cx="50" cy="45" r="24" fill="#1A3A44"/>
      <text x="50" y="52" class="sans" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">🐙</text>
      
      <text x="95" y="38" class="sans" font-size="18" font-weight="700" fill="#f8fafc">GitHub Repositories &amp; Code</text>
      <text x="95" y="62" class="mono" font-size="13" fill="#5EEAD4">github.com/Ali-salman04</text>
      
      <text x="475" y="52" class="sans arrow-nudge" font-size="24" fill="#22c55e">→</text>
    </g>
  </g>
</svg>
