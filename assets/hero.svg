<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1620"/>
      <stop offset="60%" stop-color="#0F1F2A"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C2CB"/>
      <stop offset="50%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C2CB" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0E7490" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00C2CB" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      @keyframes cycleRoles {
        0%, 20%   { opacity: 1; transform: translateY(0); }
        25%, 95%  { opacity: 0; transform: translateY(-8px); }
        100%      { opacity: 1; transform: translateY(0); }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(520px); }
      }
      .role-1 { animation: cycleRoles 12s infinite 0s; }
      .role-2 { animation: cycleRoles 12s infinite 3s; opacity: 0; }
      .role-3 { animation: cycleRoles 12s infinite 6s; opacity: 0; }
      .role-4 { animation: cycleRoles 12s infinite 9s; opacity: 0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="520" rx="24" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="1080" cy="120" r="180" fill="#00C2CB" opacity="0.12" filter="url(#neonGlow)"/>
  <circle cx="920" cy="400" r="140" fill="#0E7490" opacity="0.08" filter="url(#neonGlow)"/>

  <!-- Terminal Status Header -->
  <g transform="translate(60, 55)">
    <circle cx="8" cy="8" r="5" fill="#0E7490">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="12" class="mono" font-size="13" font-weight="600" fill="#5EEAD4" letter-spacing="2">SYSTEM.ONLINE // HAFIZ-ALI-SALMAN.DEV</text>
    <text x="960" y="12" class="mono" font-size="13" fill="#64748b" text-anchor="end">LOC: LAHORE, PK [31.5204° N, 74.3587° E]</text>
  </g>

  <!-- Hero Main Content -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" class="mono" font-size="18" fill="#94a3b8" letter-spacing="1">HI THERE, I'M</text>
    
    <!-- Large Name Reveal -->
    <text x="0" y="65" class="sans" font-size="56" font-weight="900" fill="#f8fafc" letter-spacing="-1">
      Hafiz Ali <tspan fill="url(#accentGrad)">Salman</tspan>
    </text>
    
    <!-- Dynamic Cycling Roles -->
    <g transform="translate(0, 115)">
      <rect x="0" y="-24" width="520" height="38" rx="8" fill="#122430" stroke="#1A3A44"/>
      <circle cx="16" cy="-5" r="4" fill="#00C2CB"/>
      
      <text x="32" y="0" class="mono role-1" font-size="16" font-weight="600" fill="#2DD4BF">Full Stack Engineer</text>
      <text x="32" y="0" class="mono role-2" font-size="16" font-weight="600" fill="#5EEAD4">SaaS &amp; Marketplace Builder</text>
      <text x="32" y="0" class="mono role-3" font-size="16" font-weight="600" fill="#2DD4BF">Third-Party Integrations Specialist</text>
      <text x="32" y="0" class="mono role-4" font-size="16" font-weight="600" fill="#34d399">Scalable APIs &amp; System Architecture</text>
    </g>

    <!-- Pitch Statement — kept inside ~720px left column (card starts at x=820) -->
    <text x="0" y="160" class="sans" font-size="15" fill="#cbd5e1" font-weight="400">Building production systems from schema to release</text>
    <text x="0" y="184" class="sans" font-size="15" fill="#cbd5e1" font-weight="400">— integrations, secure REST APIs,</text>
    <text x="0" y="208" class="sans" font-size="15" fill="#cbd5e1" font-weight="400">and scalable backends.</text>

    <!-- Meta Details Row -->
    <g transform="translate(0, 250)">
      <!-- Company Pill -->
      <rect x="0" y="0" width="220" height="42" rx="10" fill="#122430" stroke="#00C2CB" stroke-opacity="0.4"/>
      <text x="18" y="26" class="sans" font-size="14" font-weight="600" fill="#f8fafc">🏥 Medsynthea</text>

      <!-- Status Pill -->
      <rect x="235" y="0" width="260" height="42" rx="10" fill="#122430" stroke="#1F4A55"/>
      <circle cx="255" cy="21" r="4" fill="#22c55e"/>
      <text x="270" y="26" class="sans" font-size="14" fill="#94a3b8">Open to New Challenges</text>
    </g>
  </g>

  <!-- Right Side Visual Identity Card -->
  <g transform="translate(820, 110)">
    <rect width="320" height="340" rx="20" fill="#0C1A24" stroke="#1A3A44" stroke-width="1.5"/>
    <rect x="1" y="1" width="318" height="338" rx="19" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.25"/>
    
    <!-- Stylized Avatar Emblem — teal ring (matches profile photo) -->
    <circle cx="160" cy="110" r="64" fill="#00C2CB"/>
    <circle cx="160" cy="110" r="56" fill="#122430"/>
    <text x="160" y="125" class="sans" font-size="34" font-weight="900" fill="#5EEAD4" text-anchor="middle">HAS</text>

    <!-- ID Badge Data -->
    <text x="160" y="210" class="sans" font-size="18" font-weight="800" fill="#f8fafc" text-anchor="middle">HAFIZ ALI SALMAN</text>
    <text x="160" y="235" class="mono" font-size="12" fill="#5EEAD4" text-anchor="middle">FULL STACK ENGINEER</text>

    <!-- Core Tags -->
    <g transform="translate(25, 265)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#1A3A44"/>
      <text x="40" y="18" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">REACT</text>

      <rect x="90" y="0" width="85" height="28" rx="6" fill="#1A3A44"/>
      <text x="132" y="18" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">NODE</text>

      <rect x="185" y="0" width="85" height="28" rx="6" fill="#1A3A44"/>
      <text x="227" y="18" class="mono" font-size="11" fill="#94a3b8" text-anchor="middle">NEXT</text>
    </g>
  </g>
</svg>
